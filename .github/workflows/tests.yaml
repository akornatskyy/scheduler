name: tests

on:
  schedule:
    - cron: '0 3 * * 0' # At 03:00 on Sunday.
  push:
    branches:
      - master
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - master

jobs:
  go:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        go: ['1.26', '1.27']

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - run: make install-api api

  node:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [25, 26]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - run: make install-web web
